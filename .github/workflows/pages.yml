name: Deploy site to GitHub Pages

# 触发方式：
# 1. 推送到部署分支（默认 main，可在仓库 Settings → Pages 或这里改 branches 调整）
# 2. 手动触发（Actions 页面点 Run workflow）
on:
  push:
    branches:
      - main
  workflow_dispatch:

# 只读仓库、写 Pages、用 OIDC 令牌发布（官方 Pages 工作流要求）
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个 Pages 部署；新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 复用 t4 的零依赖构建命令（见 site/README.md），产物输出到 site/dist
      # 构建只读仓库内数据，不需要任何密钥或 .env
      - name: Build site
        run: python3 site/build.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
